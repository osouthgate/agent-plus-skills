name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate marketplace.json
        run: python -c "import json; json.load(open('marketplace.json'))"
      - name: Run plugin tests
        run: |
          set -e
          for plugin in */test/; do
            plugin_dir=$(dirname "$plugin")
            echo "=== $plugin_dir ==="
            python -m unittest discover -s "$plugin" -v
          done
